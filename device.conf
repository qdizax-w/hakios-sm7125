# devices/miatoll/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device miatoll
	title       Redmi Note 9S / 9 Pro / Note 10 Lite / POCO M2 Pro
	vendor      Xiaomi
	soc         sm7125
	defconfig   miatoll_defconfig
	firmware    pull-firmware.sh
	maintainer  qdizax-w (README.md)
	status      display     works     the panel through UEFI's framebuffer; iOS drawn at 2x (fbscale=2) and enlarged, frames in step with the panel's scan (fb_scan=1); brightness on the PM6150L's WLED (backlight=2)
	status      touch       works     FocalTech FT8756 of the Huaxing panel on SPI by hand (ft8756=1, firmware from mk-fw-touch-miatoll.sh); the Tianma panel's Novatek NT36675 has no driver
	status      buttons     works     power and volume down through the PM6150's power-on block (CONFIG_HAKIOS_BUTTONS)
	status      cpu         works     all 8 cores, both OSM groups at their top row (cpus=8 bootcpu=7 cpufreq=1)
	status      gpu         partial   Adreno 618, OpenGL ES through Mesa at 750 MHz (gpu=1 adreno_speed=6), 60 frames a second scrolling at 2x; the wallpaper at 2x (twins of the 3x ones, userland/build.sh), app animations slower
	status      storage     works     iOS's root volume on the phone's flash (the partition darwin), /private/var kept (ufs=2 root_apfs=ufs_darwin ufs_write=1 var_store=1)
	status      audio       works     the speaker: the audio DSP (adsp=1), its tertiary MI2S port and the TAS2562 amplifier on I2C 9, what iOS plays (sound=4); no microphone yet
	status      battery     partial   the level, voltage and current from the PM6150's fuel gauge, read only (qg=1); the charger's watchdog stops charging a few minutes into a run (charge=1 services it)
	status      haptic      works     the AW8624 on I2C 4 (address 0x5a), Android's waveforms in its RAM, taps and vibrations from iOS's Actuator (aw8624=5)
	status      camera      missing
	status      torch       works     the PM6150L flash LED at 300 mA, Control Center's button (torch=3)
	status      wifi        missing   WCN3990 (ath10k over SNOC) runs in the modem: the modem passes its signature check and gets its memory; the phone stops while its image goes in (modem=1)
	status      bluetooth   missing
	status      cellular    missing   not possible: iOS's cellular stack does not speak a Qualcomm modem's interface
	status      network     works     internet over the USB cable, the phone a CDC-ECM adapter (usbnet=1)
	status      thermal     missing
