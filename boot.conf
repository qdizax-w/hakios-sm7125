# devices/miatoll/boot.conf: what xl and the boot image need to start this phone, beside what the kernel's configuration
# (configs/miatoll_defconfig) says. Read by xl (DEVICE=miatoll) and mkxnuimg.py.
NAME="Redmi Note 9S / 9 Pro / 10 Lite / POCO M2 Pro (miatoll)"
KIND=phone

# Mu-Silicium builds miatoll per model only for the SMBIOS names (build_uefi.py -d miatoll -m N:
# 0 curtana Note 9S, 1 curtana Note 9 Pro India, 2 curtana Note 10 Lite, 3 joyeuse, 4 excalibur, 5 gram)
UEFI_TARGET=miatoll
# Mu-Silicium 3.6 (hakios-uefi, its miatoll base): later releases do not boot on these phones (Mi logo, a reset, again), and
# nothing built with clang 23 does -- build it with clang 18. The image is built on one's own computer: it holds Qualcomm's and
# Xiaomi's drivers, which are not ours to redistribute (devices/miatoll/prebuilt/SHA256SUMS: the build that boots).
MU_SILICIUM=Mu-Silicium-3.6
UEFI_FD=
DTB=                            # empty: Mu-Silicium-3.6/Resources/DTBs/miatoll.dtb
FD_BASE=0x9FD00000              # miatoll.toml and miatollPkg's memory map
FD_SIZE=0x200000
PAYLOAD_BASE=0xB0000000         # "XNU Payload" in miatollPkg's memory map; not redwood's 0xF0000000 (xnuloader/loader.c)

# The kernel's own arguments are the configuration's (tools/hakios-config.py args, from the .config of miatoll_defconfig).
# These are read by this device's drivers, which the common catalogue does not scan, so the configuration cannot name them:
# ft8756=1 the touch screen (devices/miatoll/tools/mk-fw-touch-miatoll.sh first, and with it the buttons), qg=1 the battery
# from the PM6150's fuel gauge, backlight=2 iOS's brightness on the PM6150L's WLED. (charge=1: also the charger's watchdog.)
DEVICE_ARGS="ft8756=1 qg=1 backlight=2 lite_ui=0 aw8624=5"
DEFAULT_SECS=900
# `xl ios`: iOS as one uses it, from the iOS volume on the flash (darwin), with internet over the USB cable (usbnet=1 in the
# configuration), /private/var kept in darwin between boots, for a day (the run ends with a reset, not through the loader)
IOS_IMAGE="userland/flashboot.apfs"
IOS_SECS=86400
# GL=1: Mesa for the window server; REST=1: iOS's other daemons on demand, the wallpaper's (PosterBoard) and the widgets'
# (chronod) among them; SLIM: a system image that fits 4 GB (userland/slim.miatoll)
USERLAND_VARS="RC_JOBS=rc.jobs.unlock SLIM=slim.miatoll GL=1 REST=1"
FIRMWARE="fw-gpu"
